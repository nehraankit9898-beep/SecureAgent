name: Source validation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Compile source
        run: python -m compileall -q backend/app backend/tests backend/scripts
      - name: Backend tests
        run: python -m pytest -q backend/tests
      - name: Security smoke
        run: python backend/scripts/security_smoke.py
      - name: Offline acceptance
        run: python backend/scripts/offline_acceptance.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install
        run: npm --prefix frontend ci
      - name: Contract tests
        run: npm --prefix frontend test
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Production build
        run: npm --prefix frontend run build

  desktop-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Desktop lifecycle and security tests
        run: node --test desktop/tests/*.test.js

  frozen-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install locked dependencies + PyInstaller
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Build the frozen backend (PyInstaller spec)
        run: |
          python -m PyInstaller --noconfirm --clean \
            --distpath build/backend-build \
            --workpath build/pyinstaller-work \
            backend/SecureAgentBackend.spec
      - name: Smoke-test the frozen binary (real loopback launch)
        run: python backend/scripts/binary_smoke.py build/backend-build/SecureAgentBackend

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: secureagent:ci

