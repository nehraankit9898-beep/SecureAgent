[project]
name = "secureagent"
version = "2.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.115.12", "httpx==0.28.1", "pydantic==2.12.0",
  "pydantic-settings==2.10.0", "uvicorn[standard]==0.34.2",
  "pypdf==5.6.0", "python-docx==1.1.2"
]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
